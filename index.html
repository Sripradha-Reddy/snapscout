<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnapAtlas | Explore images by topic</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Snap<span>Atlas</span></h1>
    <p class="tagline">Type a topic, map out the pictures.</p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <form id="search-form" class="search-panel">
        <label for="search-input">What do you want to see?</label>
        <input
          id="search-input"
          type="search"
          placeholder="e.g. mountains"
          autocomplete="off"
        />

        <div class="actions">
          <button id="search-btn" type="submit">Search</button>
          <button id="clear-btn" type="reset" class="ghost">Clear</button>
        </div>
      </form>

      <div class="quick-picks">
        <h2>Quick picks</h2>
        <div class="chips">
          <button type="button" class="chip">Nature</button>
          <button type="button" class="chip">Cities</button>
          <button type="button" class="chip">Animals</button>
          <button type="button" class="chip">Food</button>
        </div>
      </div>
    </aside>

    <main class="content">
      <p id="result-count">Showing 0 results</p>
      <section id="results" aria-live="polite"></section>
      <p id="empty-state">Search to see results</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
